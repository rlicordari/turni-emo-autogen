# Regole Emodinamica (progetto nuovo)
# File di configurazione: parametri "soft" e testi (i vincoli hard sono nel solver).

doctors:
  core:
    - Vizzari
    - Virga
    - Carciotto
    - Giusti
  extra:
    - De Luca
    - Saporito
  test_user: "Utente Test"

cells:
  tue_m_pair: "Vizzari / Virga"

# Mappatura fasce indisponibilità → colonne (implementata nel codice)
unavailability_mapping:
  M: [Mattina, Diurno, Tutto il giorno]        # Emodinamica Mattina
  N: [Pomeriggio, Diurno, Tutto il giorno]     # Emodinamica Pomeriggio
  O: [Notte, Tutto il giorno]                  # Reperibilità Notte (mattina/pomeriggio/diurno NON bloccano)
  P: [Mattina, Diurno, Tutto il giorno]        # Ambulatorio (mattina)
  J: [Mattina, Pomeriggio, Diurno, Tutto il giorno]  # Assunto come attività diurna del giovedì

solver:
  # Multi-pass: se infeasible, rilassiamo gradualmente alcuni vincoli soft
  # (senza toccare i vincoli hard).
  passes:
    - max_saporito_in_N: 1
      o_balance_tolerance: 1
    - max_saporito_in_N: 2
      o_balance_tolerance: 2
    - max_saporito_in_N: 3
      o_balance_tolerance: 3

objective_weights:
  # Penalità (più alto = meno desiderato)
  de_luca: 200
  saporito: 1000
